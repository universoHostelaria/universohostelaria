# Informe diario de Google Ads (en español) — Universo Hostelería
# Corre en los servidores de GitHub todos los días a las 08:00 de Brasília (11:00 UTC),
# con el día anterior completo. Si falla, avisa a lucas.carmo@flowcode.cc.
name: Informe diario Google Ads

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      to:
        description: "Destinatarios (separados por comas). Vacío = los habituales"
        required: false
        default: ""
      day:
        description: "Día del informe (AAAA-MM-DD). Vacío = ayer"
        required: false
        default: ""

concurrency:
  group: ads-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REPORT_TO: ${{ inputs.to != '' && inputs.to || 'lucas.carmo@flowcode.cc,kanto.kontato@gmail.com' }}
      REPORT_DAY: ${{ inputs.day != '' && inputs.day || 'yesterday' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar y enviar el informe (hasta 3 intentos)
        run: |
          for i in 1 2 3; do
            if python3 scripts/ads/daily_report.py --auto --send --day "$REPORT_DAY" --to "$REPORT_TO" > report.log 2>&1; then
              cat report.log; exit 0
            fi
            cat report.log
            grep -q "ERROR_LOGIN" report.log && exit 1   # login caducado: reintentar no sirve
            echo "Intento $i fallido, reintentando en 2 minutos…"; sleep 120
          done
          exit 1

      - name: Guardar copia del informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ github.run_id }}
          path: .ads-reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Avisar a Lucas si ha fallado
        if: failure()
        run: |
          MSG="$(tail -c 1500 report.log 2>/dev/null || echo 'Sin registro')"
          python3 scripts/ads/daily_report.py --notify-failure "$MSG

          Ejecución: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
